version: '3.8'

services:
  # WordPress Service
  wordpress:
    image: wordpress:latest
    container_name: christiania-biennale-wp
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress_password
      WORDPRESS_DB_NAME: christiania_biennale_db
      WORDPRESS_DEBUG: 1
    volumes:
      # Mount only wp-content for development
      - ./wp-content:/var/www/html/wp-content
      # Uncomment below to persist full WordPress installation
      # - ./wordpress:/var/www/html
    depends_on:
      - db
    restart: unless-stopped

  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: christiania-biennale-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: christiania_biennale_db
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress_password
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

  # phpMyAdmin Service
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: christiania-biennale-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root_password
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db_data:
